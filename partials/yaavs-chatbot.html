<div class="yaavbot" data-yaavbot>
  <div class="yaavbot__panel" id="yaavbot-panel" data-yaavbot-panel hidden>
    <header class="yaavbot__head" data-yaavbot-head>
      <div class="yaavbot__head-copy">
        <p class="yaavbot__title">Vaavsti</p>
        <p class="yaavbot__subtitle" data-yaavbot-status>Asistente YAAVS · IA</p>
      </div>
      <div class="yaavbot__head-actions">
        <button type="button" class="yaavbot__icon-btn" data-yaavbot-minimize aria-label="Minimizar chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="yaavbot__icon-btn yaavbot__icon-btn--close" data-yaavbot-close aria-label="Cerrar chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <div class="yaavbot__body" data-yaavbot-body>
      <div class="yaavbot__messages" data-yaavbot-messages role="log" aria-live="polite" aria-relevant="additions"></div>
      <div class="yaavbot__quick" data-yaavbot-quick aria-label="Preguntas rápidas"></div>
      <form class="yaavbot__form" data-yaavbot-form>
        <label class="sr-only" for="yaavbot-input">Mensaje</label>
        <input
          id="yaavbot-input"
          class="yaavbot__input"
          type="text"
          name="message"
          data-yaavbot-input
          placeholder="Escribe tu pregunta…"
          autocomplete="off"
          maxlength="500"
        >
        <button type="submit" class="yaavbot__send" aria-label="Enviar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h14M14 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </div>
  </div>
  <button type="button" class="yaavbot__fab" data-yaavbot-fab aria-expanded="false" aria-controls="yaavbot-panel" aria-label="Abrir Vaavsti">
    <span class="yaavbot__hint" data-yaavbot-hint>¿Dudas? Escríbeme</span>
    <span class="yaavbot__fab-icon" aria-hidden="true">
      <svg class="yaavbot__fab-icon-open yaavbot__robot" width="96" height="96" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="vaavsti-body-p" x1="18" y1="12" x2="46" y2="54" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff7fb"/>
            <stop offset="1" stop-color="#ffe8f2"/>
          </linearGradient>
          <radialGradient id="vaavsti-eye-p" cx="0.35" cy="0.35" r="0.7">
            <stop stop-color="#8adfff"/>
            <stop offset="1" stop-color="#4eb6ef"/>
          </radialGradient>
        </defs>
        <g class="yaavbot__robot-antenna">
          <path d="M32 8.5v7" stroke="#ff9ec4" stroke-width="2.6" stroke-linecap="round"/>
          <circle class="yaavbot__robot-dot" cx="32" cy="6.8" r="3.6" fill="#ff8fbc"/>
          <circle cx="32" cy="6.8" r="1.4" fill="#fff"/>
        </g>
        <ellipse class="yaavbot__robot-head" cx="32" cy="36" rx="20" ry="18.5" fill="url(#vaavsti-body-p)" stroke="#ffc1d9" stroke-width="1.8"/>
        <circle cx="15.2" cy="35" r="3.2" fill="#ffe8f2" stroke="#ffc1d9" stroke-width="1.5"/>
        <circle cx="48.8" cy="35" r="3.2" fill="#ffe8f2" stroke="#ffc1d9" stroke-width="1.5"/>
        <circle class="yaavbot__robot-blush yaavbot__robot-blush--l" cx="22.5" cy="40.5" r="3.2" fill="#ffb7d0" opacity="0.75"/>
        <circle class="yaavbot__robot-blush yaavbot__robot-blush--r" cx="41.5" cy="40.5" r="3.2" fill="#ffb7d0" opacity="0.75"/>
        <circle class="yaavbot__robot-eye yaavbot__robot-eye--l" cx="25.2" cy="34.2" r="5.4" fill="url(#vaavsti-eye-p)"/>
        <circle class="yaavbot__robot-eye yaavbot__robot-eye--r" cx="38.8" cy="34.2" r="5.4" fill="url(#vaavsti-eye-p)"/>
        <circle cx="23.7" cy="32.8" r="1.7" fill="#fff"/>
        <circle cx="37.3" cy="32.8" r="1.7" fill="#fff"/>
        <circle cx="26.8" cy="35.6" r="0.9" fill="#fff" opacity="0.7"/>
        <circle cx="40.4" cy="35.6" r="0.9" fill="#fff" opacity="0.7"/>
        <path class="yaavbot__robot-mouth" d="M28.2 44.2c1.4 2.2 3.4 3.3 3.8 3.3s2.4-1.1 3.8-3.3" stroke="#f08ab2" stroke-width="2.3" stroke-linecap="round"/>
      </svg>
      <svg class="yaavbot__fab-icon-min" width="22" height="22" viewBox="0 0 24 24" fill="none" hidden><path d="M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </span>
    <span class="yaavbot__fab-label" data-yaavbot-fab-label>Vaavsti</span>
  </button>
</div>
