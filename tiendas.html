<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script src="js/yaavs-theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563b5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Selecciona una compania YAAVS y entra al mapa de tiendas por ubicacion en Mexico.">
  <title>Conoce nuestras tiendas | YAAVS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=100">
  <link rel="stylesheet" href="decorations.css">
  <link rel="stylesheet" href="theme-light.css?v=7">
  <link rel="stylesheet" href="theme-day-night.css?v=4">
  <link rel="stylesheet" href="interior-corporate.css?v=8">
  <link rel="stylesheet" href="interior-light.css?v=2">
  <link rel="stylesheet" href="tiendas-page.css?v=5">
  <link rel="icon" href="assets/favicon-yaavs.png?v=2" type="image/png">
</head>
<body class="theme-cluster page-tiendas" data-page="tiendas">
  <div id="site-header"></div>

  <main id="contenido" class="tiendas-view" aria-label="Companias con cobertura nacional">
    <section class="tiendas-chooser" aria-label="Elige tu red">
      <header class="tiendas-chooser__head">
        <p class="tiendas-chooser__eyebrow">Conoce nuestras tiendas</p>
        <h1 class="tiendas-chooser__title">Elige tu red</h1>
      </header>

      <div class="tiendas-chooser__grid">
        <a
          class="tiendas-choice tiendas-choice--bait"
          href="tiendas-mapa.html?carrier=bait"
          aria-label="Abrir mapa de tiendas BAIT"
        >
          <span class="tiendas-choice__media" aria-hidden="true">
            <img
              src="assets/operadores/bait.jpg"
              alt=""
              width="1200"
              height="1600"
              loading="eager"
              decoding="async"
            >
          </span>
          <span class="tiendas-choice__shade" aria-hidden="true"></span>
          <span class="tiendas-choice__content">
            <img
              class="tiendas-choice__logo"
              src="assets/operadores/bait-carriers.svg"
              alt=""
              width="320"
              height="128"
              loading="eager"
              decoding="async"
            >
            <span class="tiendas-choice__copy">Encuentra tu tienda cerca de ti</span>
            <span class="tiendas-choice__cta">Ver mapa</span>
          </span>
        </a>

        <a
          class="tiendas-choice tiendas-choice--att"
          href="tiendas-mapa.html?carrier=att"
          aria-label="Abrir mapa de tiendas AT&amp;T"
        >
          <span class="tiendas-choice__media" aria-hidden="true">
            <img
              src="assets/operadores/att.jpg"
              alt=""
              width="1200"
              height="1600"
              loading="eager"
              decoding="async"
            >
          </span>
          <span class="tiendas-choice__shade" aria-hidden="true"></span>
          <span class="tiendas-choice__content">
            <img
              class="tiendas-choice__logo"
              src="assets/operadores/att-carriers.png"
              alt=""
              width="320"
              height="128"
              loading="eager"
              decoding="async"
            >
            <span class="tiendas-choice__copy">Encuentra tu tienda cerca de ti</span>
            <span class="tiendas-choice__cta">Ver mapa</span>
          </span>
        </a>
      </div>
    </section>
  </main>

  <script src="js/layout.js?v=18"></script>
  <script src="js/main.js"></script>
</body>
</html>
