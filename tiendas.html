<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script src="js/yaavs-theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Selecciona una compañía YAAVS y entra al mapa de tiendas por ubicación en México.">
  <title>Conoce nuestras tiendas | YAAVS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=101">
  <link rel="stylesheet" href="decorations.css">
  <link rel="stylesheet" href="theme-light.css?v=7">
  <link rel="stylesheet" href="theme-day-night.css?v=4">
  <link rel="stylesheet" href="interior-corporate.css?v=8">
  <link rel="stylesheet" href="interior-light.css?v=3">
  <link rel="stylesheet" href="tiendas-page.css?v=14">
  <link rel="icon" href="assets/favicon-yaavs.png?v=2" type="image/png">
</head>
<body class="theme-cluster page-tiendas" data-page="tiendas">
  <div id="site-header"></div>

  <main id="contenido" class="tiendas-view" aria-label="Compañías con cobertura nacional">
    <div class="tiendas-view__stage" aria-hidden="true">
      <video
        class="tiendas-view__stage-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster="assets/tiendas/city-night.jpg"
      >
        <source src="assets/tiendas/city-night.mp4" type="video/mp4">
      </video>
      <span class="tiendas-view__stage-veil"></span>
      <span class="tiendas-view__stage-grid"></span>
    </div>

    <section class="tiendas-chooser" aria-label="Busca tu tienda">
      <h1 class="sr-only">Elige tu compañía</h1>
      <div class="tiendas-chooser__grid">
        <a
          class="tiendas-choice tiendas-choice--bait"
          href="tiendas-mapa.html?carrier=bait"
          aria-label="Abrir mapa de tiendas BAIT"
        >
          <span class="tiendas-choice__media" aria-hidden="true">
            <img
              src="assets/operadores/bait-portada.jpg"
              alt=""
              width="1080"
              height="1080"
              loading="eager"
              decoding="async"
            >
          </span>
          <span class="tiendas-choice__shade" aria-hidden="true"></span>
          <span class="tiendas-choice__content">
            <img
              class="tiendas-choice__logo"
              src="assets/operadores/bait-carriers.svg"
              alt=""
              width="320"
              height="128"
              loading="eager"
              decoding="async"
            >
            <span class="tiendas-choice__copy">Tiendas BAIT cerca de ti</span>
            <span class="tiendas-choice__cta">Ver mapa</span>
          </span>
        </a>

        <a
          class="tiendas-choice tiendas-choice--att"
          href="tiendas-mapa.html?carrier=att"
          aria-label="Abrir mapa de tiendas AT&amp;T"
        >
          <span class="tiendas-choice__media" aria-hidden="true">
            <img
              src="assets/operadores/att-portada.jpg"
              alt=""
              width="1080"
              height="1080"
              loading="eager"
              decoding="async"
            >
          </span>
          <span class="tiendas-choice__shade" aria-hidden="true"></span>
          <span class="tiendas-choice__content">
            <img
              class="tiendas-choice__logo"
              src="assets/operadores/att-carriers.png"
              alt=""
              width="320"
              height="128"
              loading="eager"
              decoding="async"
            >
            <span class="tiendas-choice__copy">Tiendas AT&amp;T cerca de ti</span>
            <span class="tiendas-choice__cta">Ver mapa</span>
          </span>
        </a>
      </div>
    </section>
  </main>

  <script src="js/layout.js?v=22" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
